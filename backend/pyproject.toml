[project]
name = "overhearth"
version = "0.1.0"
description = "Overhearth: Alexa avatars living in a shared town, passing thanks and know-how between homes"
authors = [
    { name = "23aki", email = "tsukisaki.t@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
