<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overhearth · Film scenes</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1118; overflow: hidden; }
      #stage { position: absolute; inset: 0; }
      .panel-css { position: absolute; pointer-events: none; overflow: hidden; }
      /* One shape with its tail: outer triangle in the border color, inner one in the fill. */
      .bubble { --bc: #1d2230; --bg: #fff; --tw: 10px; --th: 11px; --ih: 8.03px; --b: 2px; --k: 0.9091; max-width: 300px; background: var(--bg); color: #1d2230; border: 2px solid var(--bc); border-radius: 12px; padding: 8px 12px; font: 600 20px/1.3 system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Malgun Gothic", sans-serif; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); position: relative; transform: translateY(-14px); white-space: normal; }
      .bubble.alexa { --bc: #34c6f4; --bg: #f2fbff; }
      .bubble::before, .bubble::after { content: ""; position: absolute; left: 50%; width: 0; height: 0; border-style: solid; border-color: transparent; }
      .bubble::before { bottom: calc(-1 * var(--th)); margin-left: calc(-1 * var(--tw)); border-width: var(--th) var(--tw) 0; border-top-color: var(--bc); }
      .bubble::after { bottom: calc(-1 * var(--ih)); margin-left: calc(-1 * (var(--ih) + var(--b) + 1px) * var(--k)); border-width: calc(var(--ih) + var(--b) + 1px) calc((var(--ih) + var(--b) + 1px) * var(--k)) 0; border-top-color: var(--bg); }
      .bubble.small { font-size: 17px; padding: 6px 10px; }
      .bubble.big { font-size: 54px; max-width: 900px; padding: 16px 28px; border-width: 4px; border-radius: 22px; transform: translateY(-30px); --tw: 26px; --th: 30px; --ih: 23.89px; --b: 4px; --k: 0.8667; }
      .bubble.mid { font-size: 40px; max-width: 560px; padding: 10px 18px; border-width: 3px; border-radius: 16px; --tw: 19px; --th: 22px; --ih: 17.41px; --b: 3px; --k: 0.8636; }
      .emote.big { font-size: 64px; }
      .heart svg { width: 132px; height: 120px; display: block; filter: drop-shadow(0 4px 0 rgba(0,0,0,.25)); }
      .emote { font-size: 30px; transform: translateY(-10px); filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
      .city { position: absolute; left: 14px; bottom: 12px; font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; background: rgba(13,17,24,.6); padding: 3px 10px; border-radius: 8px; }
      .caption { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); font: 600 26px system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; background: rgba(13,17,24,.72); padding: 8px 18px; border-radius: 10px; opacity: 0; transition: opacity .4s; }
      .caption.on { opacity: 1; }
      #flash { position: absolute; inset: 0; background: #e9fbff; opacity: 0; pointer-events: none; }
      .divider { position: absolute; background: #0d1118; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="caption" class="caption"></div>
    <div id="flash"></div>
    <script type="module" src="/src/film.ts"></script>
  </body>
</html>
