<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overhearth · Film scenes</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1118; overflow: hidden; }
      #stage { position: absolute; inset: 0; }
      .panel-css { position: absolute; pointer-events: none; overflow: hidden; }
      .bubble { max-width: 300px; background: #fff; color: #1d2230; border: 2px solid #1d2230; border-radius: 12px; padding: 8px 12px; font: 600 20px/1.3 system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Malgun Gothic", sans-serif; box-shadow: 0 3px 0 rgba(0,0,0,.25); position: relative; transform: translateY(-14px); white-space: normal; }
      .bubble::after { content: ""; position: absolute; left: 50%; bottom: -10px; margin-left: -9px; border: 9px solid transparent; border-top-color: #fff; border-bottom: 0; }
      .bubble.alexa { border-color: #34c6f4; background: #f2fbff; }
      .bubble.alexa::after { border-top-color: #f2fbff; }
      .bubble.small { font-size: 17px; padding: 6px 10px; }
      .bubble.big { font-size: 40px; max-width: 640px; padding: 14px 22px; border-width: 3px; border-radius: 18px; transform: translateY(-18px); }
      .bubble.big::after { bottom: -14px; margin-left: -13px; border-width: 13px; }
      .bubble.mid { font-size: 30px; max-width: 420px; padding: 10px 16px; border-width: 3px; border-radius: 14px; }
      .emote.big { font-size: 54px; }
      .emote { font-size: 30px; transform: translateY(-10px); filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
      .city { position: absolute; left: 14px; bottom: 12px; font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; background: rgba(13,17,24,.6); padding: 3px 10px; border-radius: 8px; }
      .caption { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); font: 600 26px system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; background: rgba(13,17,24,.72); padding: 8px 18px; border-radius: 10px; opacity: 0; transition: opacity .4s; }
      .caption.on { opacity: 1; }
      #flash { position: absolute; inset: 0; background: #e9fbff; opacity: 0; pointer-events: none; }
      .divider { position: absolute; background: #0d1118; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="caption" class="caption"></div>
    <div id="flash"></div>
    <script type="module" src="/src/film.ts"></script>
  </body>
</html>
