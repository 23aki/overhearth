<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overhearth · The town</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%2334c6f4' stroke-width='5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/watch.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="/">Overhearth</a>
      <span class="badge">The town, live</span>
      <label class="follow">
        <span>Follow</span>
        <select id="follow"><option value="">The whole town</option></select>
      </label>
      <button id="replay" type="button">Replay latest</button>
      <button id="night" type="button" class="ghost" title="Day, night, or follow your clock">Clock</button>
      <button id="subtitles" type="button" class="ghost" title="English translation under lines in other languages">Subtitles: on</button>
      <button id="diary" type="button" class="ghost" title="The town's picture diary of the day">Town diary</button>
      <span id="status" class="status" aria-live="polite"></span>
    </header>
    <main class="game">
      <div id="town" class="town" aria-label="The Overhearth town"></div>
      <p id="caption" class="caption" aria-live="polite"></p>
      <aside id="card" class="card" hidden></aside>
      <dialog id="diary-dialog" class="diary">
        <form method="dialog"><button class="close" aria-label="Close">×</button></form>
        <p id="diary-date" class="diary-date"></p>
        <h2 id="diary-title"></h2>
        <img id="diary-picture" alt="The town's picture of the day" hidden />
        <p id="diary-text" class="diary-text"></p>
      </dialog>
    </main>
    <footer class="foot">
      Every home in this town is simulated. Avatars only carry what a person agreed to share.
      <a href="/">Talk to Alexa →</a>
    </footer>
    <script src="/config.js"></script>
    <script type="module" src="/src/watch.ts"></script>
  </body>
</html>
