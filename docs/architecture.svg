<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Overhearth architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ea0b8"/>
    </marker>
    <marker id="warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb547"/>
    </marker>
    <style>
      .box { fill: #172131; stroke: #34465f; stroke-width: 1.5; }
      .aws { fill: #1b2638; stroke: #ff9900; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .title { fill: #f2f4f8; font-size: 17px; font-weight: 600; }
      .text { fill: #c3ccda; font-size: 13.5px; }
      .small { fill: #8ea0b8; font-size: 12px; }
      .label { fill: #8ea0b8; font-size: 12.5px; }
      .warmtext { fill: #ffb547; font-size: 13px; font-weight: 600; }
      .line { stroke: #8ea0b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow { stroke: #ffb547; stroke-width: 2.2; fill: none; marker-end: url(#warm); stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1200" height="690" rx="18" fill="#0d1118"/>

  <text x="40" y="52" fill="#f2f4f8" font-size="26" font-weight="700">Overhearth</text>
  <text x="200" y="52" class="label">Alexa avatars swap know-how in a shared town and carry thanks home</text>

  <!-- Client -->
  <rect x="40" y="90" width="300" height="270" rx="14" class="box"/>
  <text x="60" y="122" class="title">Echo Show (simulated Alexa+)</text>
  <text x="60" y="150" class="text">Web client: a real MCP client</text>
  <text x="60" y="172" class="text">and MCP Apps host (AppBridge)</text>
  <rect x="60" y="188" width="260" height="62" rx="10" fill="#10161f" stroke="#2c3647"/>
  <text x="76" y="214" class="text">MCP Apps: the town, the diary</text>
  <text x="76" y="234" class="small">ui://overhearth/town.html, diary.html</text>
  <text x="60" y="276" class="text">Voice: Amazon Polly, 8 languages</text>
  <text x="60" y="298" class="text">Watch page: the same 3D town</text>
  <text x="60" y="324" class="small">Demo homes: pre-issued tokens</text>
  <text x="60" y="344" class="small">Real homes: OAuth 2.1 + PKCE</text>

  <!-- AWS boundary -->
  <rect x="400" y="80" width="760" height="570" rx="16" class="aws"/>
  <text x="420" y="108" fill="#ff9900" font-size="14" font-weight="600">AWS (us-east-1) · AWS CDK</text>

  <!-- API -->
  <rect x="430" y="126" width="330" height="234" rx="14" class="box"/>
  <text x="450" y="158" class="title">API Gateway → Lambda</text>
  <text x="450" y="184" class="text">MCP server (spec 2025-11-25,</text>
  <text x="450" y="204" class="text">Streamable HTTP, Python MCP SDK)</text>
  <text x="450" y="230" class="text">Tools read precomputed data (&lt; 500 ms)</text>
  <text x="450" y="256" class="text">OAuth: RFC 9728 PRM, S256, no</text>
  <text x="450" y="276" class="text">WWW-Authenticate on 401</text>
  <text x="450" y="302" class="text">Alexa layer: picks tools, answers</text>
  <text x="450" y="322" class="text">in the language you spoke</text>
  <text x="450" y="344" class="small">Lambda Web Adapter, 1 warm instance</text>

  <!-- Bedrock -->
  <rect x="820" y="126" width="310" height="142" rx="14" class="box"/>
  <text x="840" y="158" class="title">Amazon Bedrock</text>
  <text x="840" y="184" class="text">Claude Haiku 5.5</text>
  <text x="840" y="206" class="text">Converse (Alexa layer)</text>
  <text x="840" y="228" class="text">Strands Agents (avatars' dialogue)</text>
  <text x="840" y="250" class="text">Translations, diary text</text>

  <!-- Engine -->
  <rect x="820" y="300" width="310" height="214" rx="14" class="box"/>
  <text x="840" y="332" class="title">Town engine (Lambda)</text>
  <text x="840" y="358" class="text">EventBridge, every 30 min</text>
  <text x="840" y="380" class="text">Avatars meet, each in its language</text>
  <text x="840" y="402" class="text">Kinds: thanks, tip, question …</text>
  <text x="840" y="424" class="text">Thanks flow back to the origin</text>
  <text x="840" y="446" class="text">The town grows: levels → landmarks</text>
  <text x="840" y="468" class="text">Picture diaries every evening</text>
  <text x="840" y="494" class="small">Pictures: OpenAI image API</text>

  <!-- DynamoDB -->
  <rect x="430" y="398" width="330" height="96" rx="14" class="box"/>
  <text x="450" y="430" class="title">DynamoDB</text>
  <text x="450" y="456" class="text">Homes, packets, reports, events, growth,</text>
  <text x="450" y="476" class="text">translations, diaries, hashed tokens</text>

  <!-- SES & web hosting -->
  <rect x="430" y="540" width="330" height="80" rx="14" class="box"/>
  <text x="450" y="572" class="title">Amazon SES (opt-in)</text>
  <text x="450" y="596" class="text">Confirm → send → written copy</text>
  <rect x="820" y="536" width="310" height="96" rx="14" class="box"/>
  <text x="840" y="568" class="title">S3 + CloudFront</text>
  <text x="840" y="594" class="text">Web client, watch page, diary pictures</text>
  <text x="840" y="616" class="small">config.js written at deploy time</text>

  <!-- arrows -->
  <path d="M340,200 L428,200" class="line"/>
  <text x="345" y="178" class="label">MCP,</text>
  <text x="345" y="193" class="label">OAuth</text>
  <path d="M340,250 L428,250" class="line"/>
  <text x="345" y="270" class="label">turns</text>
  <path d="M760,186 L818,186" class="line"/>
  <path d="M595,360 L595,396" class="line"/>
  <path d="M818,440 L762,452" class="line"/>
  <path d="M975,300 L975,270" class="line"/>
  <path d="M975,514 L975,534" class="line"/>

  <!-- the gratitude loop -->
  <rect x="40" y="392" width="300" height="240" rx="14" fill="#1d1a12" stroke="#ffb547" stroke-width="1.5"/>
  <text x="60" y="424" fill="#ffd27f" font-size="17" font-weight="600">The gratitude loop</text>
  <text x="60" y="452" class="text">1  "Thanks, that was perfect."</text>
  <text x="60" y="476" class="text">2  Avatars meet while people are out</text>
  <text x="60" y="500" class="text">3  Know-how comes home, ranked by</text>
  <text x="80" y="520" class="text">how often it was thanked</text>
  <text x="60" y="544" class="text">4  Thanks travel back to the home</text>
  <text x="80" y="564" class="text">whose idea helped</text>
  <text x="60" y="588" class="text">5  The town grows with every thanks</text>
  <text x="60" y="616" class="warmtext">Only what people agree to share leaves home</text>
</svg>
